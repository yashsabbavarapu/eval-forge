name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict evalforge tests
      - run: pytest -q

  build:
    name: package builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # A wheel that ships no py.typed silently drops types for consumers.
      - name: wheel ships the typing marker
        run: python -c "import zipfile,glob,sys; w=glob.glob('dist/*.whl')[0]; names=zipfile.ZipFile(w).namelist(); sys.exit(0 if 'evalforge/py.typed' in names else 'py.typed missing from wheel')"
      - name: installs and runs from the wheel alone
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/evalforge --version

  gate:
    name: eval-forge gates itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      # Runs fully offline. Add GEMINI_API_KEY as a repository secret and drop
      # --workers to judge with Gemini instead; exit 1 still means "regression".
      - name: prompt regression gate
        run: |
          evalforge check \
            --candidate fixtures/prompt_v2.txt \
            --baseline fixtures/prompt_v1.txt \
            --suite fixtures/test_suite.json \
            --alpha 0.05
      - name: publish the scorecard to the job summary
        if: always()
        run: cat eval_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-scorecard
          path: |
            eval_report.md
            eval_results.json
